<section class="studio-controls" id="studio-controls" hidden aria-labelledby="studio-title">
  <div class="studio-heading"><div><span>ออกแบบเอง</span><h3 id="studio-title">{% if is_lantern %}โคม{% else %}กระทง{% endif %}ในแบบของเรา</h3></div><span class="studio-live-label">ดูตัวอย่างได้ทันที</span></div>
  <div class="studio-preview"><div id="studio-preview-art"></div><span>เลือกสีและของตกแต่งด้านล่าง</span></div>
  <div class="studio-field"><label for="studio-color">สี{% if is_lantern %}โคม{% else %}ดอกไม้{% endif %}</label><div class="studio-palette">{% for color in art_catalog.studio.palette %}<button type="button" class="color-swatch" style="--swatch:{{ color.value }}" data-studio-palette="{{ color.value }}" aria-label="สี{{ color.name }}" aria-pressed="{% if forloop.first %}true{% else %}false{% endif %}"></button>{% endfor %}<label class="custom-color" title="เลือกสีอื่น"><input id="studio-color" type="color" value="#eaa3b5" data-studio-config="color" aria-label="เลือกสีเอง"><span>+</span></label></div></div>
  <div class="studio-field" data-only-krathong><span class="studio-label">รูปแบบใบตอง</span><div class="leaf-options">{% for leaf in art_catalog.studio.leaves %}<button type="button" data-studio-leaf="{{ leaf.value }}" aria-pressed="{% if forloop.first %}true{% else %}false{% endif %}"><span></span><strong>{{ leaf.name }}</strong></button>{% endfor %}</div></div>
  <div class="studio-row" data-only-krathong><label class="studio-field">สีใบตอง<input type="color" value="#4f8a60" data-studio-config="leaf_color" aria-label="สีใบตอง"></label><label class="studio-field">ของตกแต่ง<select data-studio-config="decoration"><option value="flowers">ดอกไม้</option><option value="pearls">ไข่มุก</option><option value="ribbon">โบว์</option></select></label></div>
  <div class="studio-row" data-only-krathong><label class="studio-field">ธูป<select data-studio-config="incense"><option value="0">ไม่ใส่ธูป</option><option value="1">1 ดอก</option><option value="3" selected>3 ดอก</option></select></label><label class="studio-field">เทียน<select data-studio-config="candles"><option value="0">ไม่ใส่เทียน</option><option value="1" selected>1 เล่ม</option><option value="2">2 เล่ม</option><option value="3">3 เล่ม</option></select></label></div>
  <label class="studio-field studio-candle-color">สีเทียน<input type="color" value="#f7dfaa" data-studio-config="candle_color" aria-label="สีเทียน"></label>
  <p class="field-error" data-error="appearance"></p>
</section>
