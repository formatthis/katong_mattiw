# Render Blueprint: free web service + free Postgres.
# Render dashboard → New → Blueprint → pick this repository.
services:
  - type: web
    name: khuenloy
    runtime: python
    plan: free
    buildCommand: bash build.sh
    startCommand: gunicorn loykrathong.wsgi:application --workers 2 --threads 4 --timeout 60
    healthCheckPath: /api/krathongs/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: khuenloy-db
          property: connectionString
      - key: DJANGO_SUPERUSER_USERNAME
        sync: false
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false

databases:
  - name: khuenloy-db
    plan: free
    databaseName: khuenloy
    user: khuenloy
